name: Career Finder checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - run: pip install -r backend/requirements.txt
      # Same as scripts/check.sh: no live availability checks, HyDE calls or tracing.
      - run: python -m unittest discover -s tests
        env:
          CAREER_LANGSMITH_TRACING: 'false'
          CAREER_EVALUATION_PREFLIGHT: 'false'
          QUERY_BUILDER: evidence
      - run: npm ci
        working-directory: frontend
      - run: npm run types:generate && git diff --exit-code -- openapi.json src/types/api.d.ts
        working-directory: frontend
      - run: npm test && npm run test:legacy && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: frontend
